[project]
name = "fsatts"
version = "2.0.0"
description = "Production local TTS plugin service (sherpa-onnx multi-model, high concurrency)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sherpa-onnx>=2.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "soundfile>=0.12.0",
  "numpy>=1.26.0",
  "websockets>=12",
  "pydantic>=2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cuda-runtime-cu12",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
  "nvidia-cufft-cu12",
  "nvidia-cuda-nvrtc-cu12",
  "nvidia-curand-cu12",
  "nvidia-cusolver-cu12",
  "nvidia-cusparse-cu12",
  "nvidia-nvjitlink-cu12",
]

[project.scripts]
fsatts = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "ruff>=0.17.3",
]


[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "scripts"]
exclude = [
  ".venv",
  "build",
  "dist",
  "models",
  "outputs",
  "web/node_modules",
  "web/dist",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
]
ignore = [
  "E501",  # line length handled by formatter
  "B008",  # FastAPI Depends() in defaults is intentional
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201", "E402"]
"scripts/build/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
