[project]
name = "fsatts"
version = "2.0.0"
description = "Production local TTS plugin service (sherpa-onnx multi-model, high concurrency)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sherpa-onnx>=2.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "soundfile>=0.12.0",
  "numpy>=1.26.0",
  "websockets>=12",
  "pydantic>=2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cuda-runtime-cu12",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
  "nvidia-cufft-cu12",
  "nvidia-cuda-nvrtc-cu12",
  "nvidia-curand-cu12",
  "nvidia-cusolver-cu12",
  "nvidia-cusparse-cu12",
  "nvidia-nvjitlink-cu12",
]
dev = [
  "pyinstaller>=6.0",
]

[project.scripts]
fsatts = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
