<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sherpa-onnx TTS 测试</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>sherpa-onnx 文本转语音</h1>
      <p class="sub">模型：vits-melo-tts-zh_en · 支持整段合成与 <strong>实时流播放</strong></p>
    </header>

    <section class="status" id="statusBox">正在检查模型状态…</section>

    <label class="label" for="mode">语言模式（说明用，同一模型）</label>
    <div class="modes" id="modes">
      <button type="button" class="mode" data-mode="zh" data-sample="你好，欢迎使用本地文本转语音测试。第一句先出声。第二句继续播放。">中文</button>
      <button type="button" class="mode" data-mode="en" data-sample="Hello, this is a local streaming text to speech demo. You should hear audio before synthesis finishes.">英文</button>
      <button type="button" class="mode active" data-mode="mixed" data-sample="This is a 中英文的 text to speech 实时流式测试例子。第一句。第二句继续。">中英混合</button>
    </div>

    <label class="label" for="text">输入文本</label>
    <textarea id="text" rows="5" maxlength="2000" placeholder="输入中文、英文或中英混合文本…"></textarea>

    <div class="row">
      <label class="label inline" for="speed">语速 <span id="speedVal">1.0</span></label>
      <input id="speed" type="range" min="0.5" max="2.0" step="0.1" value="1.0" />
    </div>

    <div class="actions">
      <button id="streamBtn" class="primary" type="button">实时流播放</button>
      <button id="stopBtn" class="ghost" type="button" disabled>停止</button>
      <button id="synthBtn" class="ghost" type="button">整段合成下载</button>
      <a id="downloadLink" class="ghost disabled" href="#">下载 WAV</a>
    </div>

    <div class="player-wrap">
      <div class="stream-meter">
        <div class="bar" id="progressBar"></div>
      </div>
      <p class="meta" id="streamMeta">流播放状态：空闲</p>
      <audio id="player" controls></audio>
      <p class="meta" id="meta"></p>
      <p class="error" id="error"></p>
    </div>

    <footer>
      <p>实时流：WebSocket <code>/ws/tts</code> + Web Audio API 边收边播。整段：<code>POST /api/tts</code> 返回完整 WAV。</p>
      <p>基于 <a href="https://github.com/k2-fsa/sherpa-onnx" target="_blank" rel="noreferrer">k2-fsa/sherpa-onnx</a>。英文词需出现在 lexicon.txt 中。</p>
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
