<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sherpa-onnx TTS 测试</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>sherpa-onnx 文本转语音</h1>
      <p class="sub">模型：vits-melo-tts-zh_en（中文 / 英文 / 中英混合，单说话人）</p>
    </header>

    <section class="status" id="statusBox">正在检查模型状态…</section>

    <label class="label" for="mode">语言模式（说明用，同一模型）</label>
    <div class="modes" id="modes">
      <button type="button" class="mode" data-mode="zh" data-sample="你好，欢迎使用本地文本转语音测试。">中文</button>
      <button type="button" class="mode" data-mode="en" data-sample="Hello, this is a local text to speech demo.">英文</button>
      <button type="button" class="mode active" data-mode="mixed" data-sample="This is a 中英文的 text to speech 测试例子。">中英混合</button>
    </div>

    <label class="label" for="text">输入文本</label>
    <textarea id="text" rows="5" maxlength="2000" placeholder="输入中文、英文或中英混合文本…"></textarea>

    <div class="row">
      <label class="label inline" for="speed">语速 <span id="speedVal">1.0</span></label>
      <input id="speed" type="range" min="0.5" max="2.0" step="0.1" value="1.0" />
    </div>

    <div class="actions">
      <button id="synthBtn" class="primary" type="button">合成并播放</button>
      <a id="downloadLink" class="ghost disabled" href="#">下载 WAV</a>
    </div>

    <div class="player-wrap">
      <audio id="player" controls></audio>
      <p class="meta" id="meta"></p>
      <p class="error" id="error"></p>
    </div>

    <footer>
      <p>基于 <a href="https://github.com/k2-fsa/sherpa-onnx" target="_blank" rel="noreferrer">k2-fsa/sherpa-onnx</a> Python API。英文词需出现在 lexicon.txt 中才能正确发音。</p>
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
